<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Launch Radar: a held-out-tested value model for protocols that record no token</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="mast">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" /><circle cx="16" cy="16" r="8.5" /><circle cx="16" cy="16" r="3" class="dot" /><path d="M16 16 L27 8" class="sweep" /></svg>
    <div>
      <h1>Token Launch Radar</h1>
      <p class="sub" id="sub"></p>
    </div>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="radar">Radar</button>
    <button role="tab" data-tab="evidence">Evidence</button>
  </nav>
</header>
<main id="main">
  <section id="view-radar" class="view">
    <div class="tiles" id="tiles"></div>
    <div class="acct" id="acct"></div>
    <div class="integrity" id="integrity"></div>
    <div class="formula" id="formula"></div>
    <div class="toolbar">
      <div class="tiers" id="tiers" role="tablist"></div>
      <form class="filters" id="filters" autocomplete="off">
        <label class="f-search"><span>Search</span><input type="search" name="q" placeholder="Name or chain"></label>
        <label><span>Category</span><select name="cat"></select></label>
        <label><span>Chain</span><select name="chain"></select></label>
        <label><span>TVL</span><select name="band"></select></label>
        <label class="f-check"><input type="checkbox" name="wl"><span>Watchlist</span></label>
        <label class="ctl"><span>Plan</span><select name="plan"></select></label>
        <label class="ctl"><span>Airdrop share</span><select name="share"></select></label>
        <label class="ctl"><span>Horizon</span><select name="h"></select></label>
        <label class="ctl"><span>Capital cost</span><select name="opp"></select></label>
        <button type="button" class="reset" id="reset">Reset</button>
      </form>
    </div>
    <div class="board-wrap"><table class="board" id="board"><thead></thead><tbody></tbody></table></div>
  </section>
  <section id="view-evidence" class="view" hidden></section>
</main>
<div class="scrim" id="scrim" hidden></div>
<aside class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="d-title" hidden></aside>
<footer class="foot" id="foot"></footer>
<script src="../data.js"></script>
<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
