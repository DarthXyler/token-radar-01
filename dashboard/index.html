<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Launch Radar: pre-token protocols priced off their traded peers</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="mast">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" /><circle cx="16" cy="16" r="8.5" /><circle cx="16" cy="16" r="3" class="dot" /><path d="M16 16 L27 8" class="sweep" /></svg>
    <div>
      <h1>Token Launch Radar</h1>
      <p class="sub" id="sub">Protocols that record no token, priced off the ones that trade.</p>
    </div>
  </div>
  <dl class="stats" id="stats"></dl>
</header>
<nav class="tabs" role="tablist" id="tabs">
  <button role="tab" data-tab="radar">Radar <span class="tag">records no token</span></button>
  <button role="tab" data-tab="traded">Trading already <span class="tag">comparables</span></button>
  <button role="tab" data-tab="method">Methodology</button>
</nav>
<main id="main">
  <section id="view-radar" class="view">
    <div id="model-strip" class="model-strip"></div>
    <form class="filters" id="filters" autocomplete="off">
      <label class="f-search"><span>Search</span><input type="search" name="q" placeholder="Protocol, category or chain"></label>
      <label><span>Category</span><select name="cat"></select></label>
      <label><span>Chain</span><select name="chain"></select></label>
      <label><span>TVL band</span><select name="band"></select></label>
      <label class="f-check"><input type="checkbox" name="wl"><span>Watchlist only</span></label>
      <button type="button" class="reset" id="reset">Reset</button>
      <output id="count" class="count"></output>
    </form>
    <div class="chips" id="chips"></div>
    <div class="board-wrap"><table class="board" id="board"><thead></thead><tbody></tbody></table></div>
  </section>
  <section id="view-traded" class="view" hidden></section>
  <section id="view-method" class="view" hidden></section>
</main>
<div class="scrim" id="scrim" hidden></div>
<aside class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="d-title" hidden></aside>
<footer class="foot" id="foot"></footer>
<script src="../data.js"></script>
<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
